<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selected Works</title>
  <meta name="description" content="A minimalist, Pinterest-inspired design portfolio showcasing selected works.">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    header {
      padding: 2rem;
    }

    /* ===== GRID ===== */
    .grid {
      column-count: 3;
      column-gap: 1.5rem;
      padding: 2rem;
    }

    @media (max-width: 900px) { .grid { column-count: 2; } }
    @media (max-width: 600px) { .grid { column-count: 1; } }

    .card {
      background: #cfcfcf;
      border-radius: 20px;
      aspect-ratio: 4 / 5;
      margin-bottom: 1.5rem;
      cursor: pointer;
      transition: box-shadow 0.25s ease;
    }

    .card:hover {
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    /* stagger via spacing only */
    .card:nth-child(4n) { margin-top: 32px; }
    .card:nth-child(7n) { margin-top: 56px; }
    .card:nth-child(10n){ margin-top: 20px; }

    /* ===== VIEWER ===== */
    .viewer {
      position: fixed;
      inset: 0;
      background: #f3f3f3;
      display: none;
      z-index: 10;
    }

    .viewer.active { display: flex; }

    .viewer-left {
      flex: 1.2;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .viewer-image {
      width: 100%;
      max-width: 520px;
      aspect-ratio: 4 / 5;
      background: #444;
      border-radius: 22px;
    }

    .image-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
    }

    .arrow {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #666;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
      cursor: pointer;
    }

    .dot.active {
      background: #555;
      transform: scale(1.25);
    }

    .viewer-right {
      flex: 0.8;
      padding: 3rem 3rem 3rem 1rem;
    }

    .back {
      background: none;
      border: none;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      margin-bottom: 2rem;
    }

    .info h2 { margin: 0 0 1rem 0; }
    .info p { margin: 0.4rem 0; color: #444; }
  </style>
</head>
<body>

<header>
  <h1>Selected Works</h1>
  <p>A collection of things I’ve built and designed.</p>
</header>

<main class="grid">
  <div class="card" onclick="openViewer()"></div>
  <div class="card" onclick="openViewer()"></div>
  <div class="card" onclick="openViewer()"></div>
  <div class="card" onclick="openViewer()"></div>
  <div class="card" onclick="openViewer()"></div>
  <div class="card" onclick="openViewer()"></div>
</main>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="viewer-left">
    <div class="viewer-image" id="viewerImage"></div>

    <div class="image-controls">
      <button class="arrow" onclick="prevImage()">‹</button>
      <div class="dots">
        <div class="dot active" onclick="setImage(0)"></div>
        <div class="dot" onclick="setImage(1)"></div>
        <div class="dot" onclick="setImage(2)"></div>
      </div>
      <button class="arrow" onclick="nextImage()">›</button>
    </div>
  </div>

  <div class="viewer-right">
    <button class="back" onclick="closeViewer()">← Back</button>
    <div class="info">
      <h2>Project Name</h2>
      <p><strong>Date:</strong> Jan 2026</p>
      <p><strong>Category:</strong> Product Design</p>
      <p><strong>Description:</strong> Short explanation of the design.</p>
    </div>
  </div>
</div>

<script>
  const viewer = document.getElementById('viewer');
  const viewerImage = document.getElementById('viewerImage');
  const dots = document.querySelectorAll('.dot');

  const images = ['#444', '#555', '#666'];
  let current = 0;

  function openViewer() {
    viewer.classList.add('active');
    setImage(0);
  }

  function closeViewer() {
    viewer.classList.remove('active');
  }

  function setImage(index) {
    current = index;
    viewerImage.style.background = images[index];
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  }

  function prevImage() {
    setImage((current - 1 + images.length) % images.length);
  }

  function nextImage() {
    setImage((current + 1) % images.length);
  }
</script>

</body>
</html>
