<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected Works</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background:#f3f3f3; color:#111; }
  header { padding:2rem; text-align:center; }
  h1 { margin:0 0 .5rem 0; }
  p { margin:0; color:#555; }

  /* GRID */
  .grid {
    column-count:4;
    column-gap:12px;
    padding:1.5rem;
  }
  @media(max-width:1200px){ .grid { column-count:3; } }
  @media(max-width:900px){ .grid { column-count:2; } }
  @media(max-width:600px){ .grid { column-count:1; } }

  .card {
    background:#cfcfcf;
    border-radius:16px;
    width:100%;
    aspect-ratio:4/5;
    display:inline-block;
    margin-bottom:12px;
    cursor:pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover { transform:scale(1.05); box-shadow:0 15px 30px rgba(0,0,0,0.2); }

  /* VIEWER */
  .viewer {
    position:fixed;
    inset:0;
    background:#f3f3f3;
    display:none;
    z-index:10;
    flex-direction:row;
  }
  .viewer.active { display:flex; }

  .viewer-left {
    flex:1.6;
    padding:2rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .viewer-image {
    width:100%;
    max-width:480px;
    aspect-ratio:4/5;
    background:#444;
    border-radius:22px;
    position:relative;
  }

  .image-count {
    position:absolute;
    top:8px;
    right:12px;
    font-size:14px;
    color:#fff;
    background:rgba(0,0,0,0.3);
    padding:2px 6px;
    border-radius:8px;
  }

  .image-controls {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
  }

  .arrow { background:none; border:none; font-size:28px; cursor:pointer; color:#333; transition: color 0.2s; }
  .arrow:hover { color:#000; }

  .dots { display:flex; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#bbb; cursor:pointer; transition:all 0.2s ease; }
  .dot.active { background:#333; transform:scale(1.4); }

  .viewer-right {
    flex:0.4;
    padding:2rem 1.5rem 2rem 1rem;
    overflow:hidden;
  }
  .info { max-width:220px; }
  .back { background:none; border:none; font-size:14px; color:#555; cursor:pointer; margin-bottom:1rem; transition: color 0.2s; }
  .back:hover { color:#000; }
  .info h2 { margin:0 0 1rem 0; font-size:18px; }
  .info p { margin:0.3rem 0; color:#444; font-size:14px; }
</style>
</head>
<body>

<header>
  <h1>Selected Works</h1>
  <p>A collection of things I’ve built and designed.</p>
</header>

<main class="grid">
  <!-- hardcoded tiles for preview -->
  <div class="card" onclick="openViewer(0)"></div>
  <div class="card" onclick="openViewer(1)"></div>
  <div class="card" onclick="openViewer(2)"></div>
  <div class="card" onclick="openViewer(0)"></div>
  <div class="card" onclick="openViewer(1)"></div>
  <div class="card" onclick="openViewer(2)"></div>
  <div class="card" onclick="openViewer(0)"></div>
  <div class="card" onclick="openViewer(1)"></div>
  <div class="card" onclick="openViewer(2)"></div>
  <div class="card" onclick="openViewer(0)"></div>
  <div class="card" onclick="openViewer(1)"></div>
  <div class="card" onclick="openViewer(2)"></div>
</main>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="viewer-left">
    <div class="viewer-image" id="viewerImage">
      <div class="image-count" id="imageCount">1/3</div>
    </div>
    <div class="image-controls">
      <button class="arrow" onclick="prevImage()">‹</button>
      <div class="dots">
        <div class="dot active" onclick="setImage(0)"></div>
        <div class="dot" onclick="setImage(1)"></div>
        <div class="dot" onclick="setImage(2)"></div>
      </div>
      <button class="arrow" onclick="nextImage()">›</button>
    </div>
  </div>
  <div class="viewer-right">
    <button class="back" onclick="closeViewer()">← Back</button>
    <div class="info">
      <h2 contenteditable="true">Project Name</h2>
      <p contenteditable="true"><strong>Date:</strong> Jan 2026</p>
      <p contenteditable="true"><strong>Category:</strong> Product Design</p>
      <p contenteditable="true"><strong>Description:</strong> Short explanation of the design.</p>
    </div>
  </div>
</div>

<script>
const viewer = document.getElementById('viewer');
const viewerImage = document.getElementById('viewerImage');
const dots = document.querySelectorAll('.dot');
const imageCount = document.getElementById('imageCount');

// placeholder colors for images
const images = ['#444', '#555', '#666'];
let current = 0;

function openViewer(startIndex) {
  current = startIndex;
  viewer.classList.add('active');
  setImage(current);
}

function closeViewer() {
  viewer.classList.remove('active');
}

function setImage(index) {
  current = index;
  viewerImage.style.background = images[index];
  dots.forEach((d,i)=> d.classList.toggle('active', i===index));
  imageCount.textContent = `${index+1}/${images.length}`;
}

function prevImage() {
  setImage((current-1+images.length)%images.length);
}

function nextImage() {
  setImage((current+1)%images.length);
}
</script>

</body>
</html>
